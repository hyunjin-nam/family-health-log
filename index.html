<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Health Log</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="login-screen" class="active">
    <div class="login-container">
        <div class="login-logo">♥</div>
        <h1>Family Health Log</h1>
        <p>Enter your password to continue</p>
        <input type="password" id="password-input" placeholder="Password" autocomplete="off">
        <button onclick="login()">Sign in</button>
    </div>
</div>

<div id="app-screen">
    <div class="app-container">

        <div class="sidebar">
            <h2>Family Health Log</h2>
            <nav>
                <button class="nav-btn active" onclick="showView('calendar')">Calendar</button>
                <button class="nav-btn" onclick="showView('summary')">Summary</button>
            </nav>
        </div>

        <!-- Write View -->
        <div id="write-view" class="view">
            <div class="view-content">
                <div class="view-title">Today's Entry</div>

                <div class="form-group">
                    <label class="form-label">Date</label>
                    <input type="date" id="entry-date">
                </div>

                <div class="form-group">
                    <label class="form-label">Daily Supplement</label>
                    <div class="check-grid">
                        <label class="check-pill">
                            <input type="checkbox" id="supplement-folate">
                            <span>Folate</span>
                        </label>
                        <label class="check-pill">
                            <input type="checkbox" id="supplement-inderal5">
                            <span>Inderal 5mg</span>
                        </label>
                        <label class="check-pill">
                            <input type="checkbox" id="supplement-inderal10">
                            <span>Inderal 10mg</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Period</label>
                    <div class="check-grid">
                        <label class="check-pill">
                            <input type="checkbox" id="period">
                            <span>Yes</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Sexual Activity</label>
                    <div class="check-grid">
                        <label class="check-pill">
                            <input type="checkbox" id="trying-to-conceive">
                            <span>Yes</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Tags</label>
                    <div class="tag-input-group">
                        <input type="text" id="tag-input"
                            placeholder="Type tag, press Enter or comma"
                            onkeydown="handleTagInput(event)"
                            onblur="commitPendingTag()">
                        <div id="tag-suggestions" class="tag-suggestions"></div>
                    </div>
                    <div id="current-tags" class="tags-list"></div>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label class="form-label">Notes</label>
                        <button type="button" onclick="loadTemplate()" class="template-btn">
                            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M3 2.5A1.5 1.5 0 0 1 4.5 1h4.379a1.5 1.5 0 0 1 1.06.44l1.622 1.62a1.5 1.5 0 0 1 .439 1.061V13.5A1.5 1.5 0 0 1 10.5 15h-6A1.5 1.5 0 0 1 3 13.5v-11Z" stroke="currentColor" stroke-width="1.2"/>
                                <path d="M5.5 6.5h5M5.5 9h5M5.5 11.5h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                            </svg>
                            Load template
                        </button>
                    </div>
                    <textarea id="entry-text"
                        placeholder="Write your thoughts… (supports # heading, **bold**, - list, - [ ] checkbox)"></textarea>
                    <div class="preview-label">Preview</div>
                    <div id="markdown-preview" class="markdown-preview markdown-body"></div>
                </div>

                <div class="btn-row">
                    <button onclick="saveEntry()" class="btn-primary">Save entry</button>
                    <button onclick="deleteEntry()" class="btn-danger">Delete</button>
                </div>
            </div>
        </div>

        <!-- Calendar View -->
        <div id="calendar-view" class="view active">
            <div class="view-content">
                <div class="view-title">Calendar</div>
                <div class="calendar-nav">
                    <button class="cal-nav-btn" onclick="previousMonth()">←</button>
                    <h3 id="calendar-month"></h3>
                    <button class="cal-nav-btn" onclick="nextMonth()">→</button>
                </div>
                <div class="calendar-grid calendar-weekdays">
                    <span class="calendar-day-label">Mon</span>
                    <span class="calendar-day-label">Tue</span>
                    <span class="calendar-day-label">Wed</span>
                    <span class="calendar-day-label">Thu</span>
                    <span class="calendar-day-label">Fri</span>
                    <span class="calendar-day-label">Sat</span>
                    <span class="calendar-day-label">Sun</span>
                </div>
                <div id="calendar-grid" class="calendar-grid"></div>
                <div class="calendar-legend">
                    <span class="legend-item"><span class="legend-swatch legend-fertile"></span>Fertile window</span>
                    <span class="legend-item"><span class="legend-swatch legend-period"></span>Expected period</span>
                </div>
            </div>
        </div>

        <!-- Summary View -->
        <div id="summary-view" class="view">
            <div class="view-content">
                <div class="view-header">
                    <div class="view-title">All Entries</div>
                    <button type="button" onclick="startNewEntry()" class="write-btn">
                        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                        </svg>
                        Write
                    </button>
                </div>
                <div id="entries-list" class="entries-list"></div>
            </div>
        </div>

    </div>
</div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js';
    import { getDatabase, ref, get, set, remove } from 'https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js';
    const firebaseConfig = {
        apiKey: "AIzaSyDDSfxQpyNfJfCb0V1D8K1U5j3Z9yzJmNc",
        authDomain: "family-health-log-f9af4.firebaseapp.com",
        databaseURL: "https://family-health-log-f9af4-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "family-health-log-f9af4",
        storageBucket: "family-health-log-f9af4.appspot.com",
        messagingSenderId: "123456789012",
        appId: "1:123456789012:web:abcdef1234567890"
    };
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    window.firebase = { database, ref, get, set, remove };
</script>
<script src="app.js"></script>
</body>
</html>
